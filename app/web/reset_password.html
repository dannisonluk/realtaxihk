<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>重設密碼 · hkfastdc</title>
    <!--
      Served by `app/api/web.py` at `GET /reset-password`, same origin as the
      API, so the POST below is a relative URL and needs no CORS preflight.

      No external assets on purpose: this page is opened from an email client
      on a phone, often on mobile data, and a third-party request would leak
      the fact that the link was opened.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card: #ffffff;
        --fg: #14181f;
        --muted: #5b6472;
        --line: #d6dae1;
        --accent: #12507a;
        --danger: #b3261e;
        --ok: #1b6b3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161c;
          --card: #1b2129;
          --fg: #eef1f5;
          --muted: #a3adba;
          --line: #333c47;
          --accent: #6fb3e0;
          --danger: #ff8a80;
          --ok: #7bd39b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang HK", "Microsoft JhengHei", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 16px; color: var(--muted); }
      label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
      input {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        font-size: 16px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 20px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: progress; }
      .msg { margin: 16px 0 0; font-weight: 600; }
      .msg[data-kind="error"] { color: var(--danger); }
      .msg[data-kind="ok"] { color: var(--ok); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>重設密碼</h1>
      <p id="lede">請設定新密碼，最少 12 個字元。完成後所有裝置都需要重新登入。</p>

      <form id="form" method="post" novalidate>
        <label for="pw">新密碼</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="12" required />

        <label for="pw2">再輸入一次</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="12" required />

        <!-- `role="alert"` is already assertive, so an explicit
             `aria-live="polite"` here would only contradict it. One element
             carries both the "link sent" confirmation and the failures, and
             announcing both immediately is the correct compromise: the user is
             waiting on this exact spot either way. -->
        <p id="msg" class="msg" role="alert" aria-atomic="true" data-kind=""></p>
        <button id="submit" type="submit">確認重設</button>
      </form>
    </main>

    <script>
      (function () {
        "use strict";
        var MIN = 12;
        var form = document.getElementById("form");
        var pw = document.getElementById("pw");
        var pw2 = document.getElementById("pw2");
        var msg = document.getElementById("msg");
        var submit = document.getElementById("submit");
        var lede = document.getElementById("lede");

        var token = new URLSearchParams(window.location.search).get("token") || "";

        function say(text, kind) {
          msg.textContent = text;
          msg.setAttribute("data-kind", kind || "");
        }

        // A link without a token cannot succeed, so say so before the user
        // types a password twice. The form is hidden rather than left enabled:
        // a submit would only produce the same sentence from the server.
        if (!token) {
          form.hidden = true;
          lede.textContent = "這個重設連結不完整。請在 App 內重新申請一次忘記密碼。";
          say("連結缺少 token，無法重設。", "error");
          return;
        }

        // The server's answer is the authority on every failure; this only
        // catches the two cases it would answer with the same generic sentence
        // for anyway, so the user is not made to wait for a round trip.
        function localProblem() {
          if (pw.value.length < MIN) {
            return "新密碼最少要 " + MIN + " 個字元。";
          }
          if (pw.value !== pw2.value) {
            return "兩次輸入的密碼不一樣。";
          }
          return "";
        }

        pw2.addEventListener("input", function () {
          if (msg.getAttribute("data-kind") === "error") {
            say("", "");
          }
        });

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          var problem = localProblem();
          if (problem) {
            say(problem, "error");
            return;
          }

          submit.disabled = true;
          say("正在提交…", "");
          try {
            var res = await fetch("/api/v1/auth/password/reset", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: token, new_password: pw.value }),
            });
            if (res.ok) {
              form.hidden = true;
              lede.textContent = "密碼已重設。請返回 App，用新密碼登入。";
              say("完成。", "ok");
              return;
            }
            var body = {};
            try {
              body = await res.json();
            } catch (ignored) {
              /* non-JSON error body; fall through to the status-based text */
            }
            if (res.status === 429) {
              say("嘗試次數太多，請稍後再試。", "error");
            } else {
              // The server answers every reset failure with one sentence on
              // purpose (see `PasswordService.reset`), so surface it verbatim
              // rather than inventing a more specific one.
              say(body.message || "連結已失效或已被使用，請重新申請。", "error");
            }
          } catch (networkError) {
            say("網絡問題，請檢查連線後再試。", "error");
          } finally {
            submit.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
