<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!--
      An internal admin console. `noindex` is not a security control, but it keeps
      the console out of search results if it is ever reachable from a wider
      network than intended.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>RealTaxi HK  ·  管理後台</title>
    <!--
      Theme boot script. Runs before the module bundle so the very first paint is
      already in the right theme; without it a dark-pinned console flashes white
      on every reload. Kept in sync by hand with `src/lib/theme.ts`
      (`readThemeMode` + `applyThemeMode`) — it cannot import that module, because
      it runs before a module system exists. A test asserts the two agree.
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('realtaxihk.console.theme');
          if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system';
          document.documentElement.dataset.theme = m;
        } catch (e) {
          document.documentElement.dataset.theme = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <!--
      The app is a hash-routed SPA: `#/kyc`, `#/fleets/<id>`. Hash routing rather
      than History API routing because this is served as static files with no
      rewrite rule — a deep link to `/fleets/<id>` would 404 before the app ever
      loaded.

      There is no server-side templating and no `dangerouslySetInnerHTML` with
      server data: see `src/components/primitives.tsx`. Driver notes, fleet names
      and contact details are all attacker-controlled strings, and this console
      renders them.
    -->
    <div id="root"></div>

    <!--
      The `lang` here and the `<noscript>` wording are the pre-boot defaults; the
      app rewrites `document.documentElement.lang` to the active locale on mount,
      and `index.html` cannot know which that will be. `zh-Hant` is the default
      locale, so the two agree until a user opts into English.
    -->
    <noscript>
      <p>此管理後台需要 JavaScript。 This admin console requires JavaScript.</p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
