name: hkfastdc_mobile
description: "hkfastdc — passenger, driver and admin client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  # SHA-256, for the TLS certificate pins in `core/network/cert_pinning.dart`.
  # It was already present transitively, but the client imports it directly now,
  # so it is declared directly.
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  intl: ^0.20.2
  web_socket_channel: ^3.0.3
  # The Cloudflare Turnstile challenge is rendered by a WebView: Cloudflare ships
  # a browser widget and nothing else, and a native re-implementation would not
  # produce a token the server would accept. See `lib/core/human/turnstile.dart`.
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Generated by tool/gen_branding_assets.py — the splash and login posters.
  # WebP, not PNG: the source is a JPEG, so PNG would preserve its compression
  # noise losslessly (measured: 904 KB as PNG vs 92 KB as WebP q90 at 1024px).
  assets:
    - assets/branding/
