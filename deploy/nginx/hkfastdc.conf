# realtaxihk - nginx TLS terminator and reverse proxy.
#
# This file belongs in the nginx `http {}` context, i.e. drop it in
# `/etc/nginx/conf.d/`. It assumes the api container is reachable as `api:8000`
# on a shared Docker network (the service name in docker-compose.yml), so nginx
# itself must run on that network - see deploy/README.md.
#
# ---------------------------------------------------------------------------
# ONE hostname: `hkfastdc.com`.
#
# There is no `api.` and no `console.` prefix, and that is a decision, not an
# omission. The repo previously carried three spellings and none was a choice;
# this file now fixes the one that is.
#
# Everything is separated by PATH on that single origin:
#
#     https://hkfastdc.com/            -> the API (unchanged, see `location /`)
#     https://hkfastdc.com/ws/         -> the API, WebSocket upgrade
#     https://hkfastdc.com/console/    -> the admin console, static files
#
# Same-origin is not just tidiness: the console calls `/api/*` as a *relative*
# URL (see `admin-web/web/vite.config.ts`), so there is no CORS preflight to
# negotiate and only one certificate to issue. `CORS_ORIGINS` still names this
# origin, because a future caller on another host would need it.
#
# The API keeps `location /` rather than being moved under a prefix, so nothing
# about the existing routing changes - the console is purely additive. `/docs`,
# `/openapi.json`, `/health` and `/metrics` therefore stay where they are.
#
# NOTE: the certificate paths below embed the hostname too. Changing one and
# not the other does not warn - nginx fails to *start*, and with
# `restart: unless-stopped` it restart-loops. Keep all five occurrences in step.
# ---------------------------------------------------------------------------

# WebSocket upgrade. `Connection` has to be sent as `upgrade` only when the
# request actually asks for it - a hardcoded `Connection: upgrade` on an
# ordinary request makes nginx and the upstream disagree about framing.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log WITHOUT the query string.
#
# This is deliberate and load-bearing. The live-trip socket has no header
# channel on the browser side, so its access token travels in the query string
# (`/ws/trip/<order_id>?token=...`, see app/api/ws.py). `$request_uri` would
# write that token to disk in plain text, on every reconnect, forever. `$uri` is
# the normalised path alone, which drops the query entirely.
#
# If you change this format, you are reintroducing that leak.
log_format realtaxihk '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time';

upstream realtaxihk_api {
    server api:8000;
    keepalive 32;
}

# Plain HTTP exists only to redirect.
server {
    listen 80;
    listen [::]:80;
    server_name hkfastdc.com;

    # ACME challenges must stay on HTTP and must not be redirected, or certbot's
    # webroot renewal fails on the second run.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1. On older builds use `listen 443 ssl http2;` above and
    # delete this line.
    http2 on;

    server_name hkfastdc.com;

    access_log /var/log/nginx/realtaxihk.access.log realtaxihk;

    ssl_certificate     /etc/letsencrypt/live/hkfastdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hkfastdc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API never proxies uploads: licence photos and avatars go straight to
    # Cloudflare R2 via presigned URLs. 1 MiB is generous for JSON and keeps a
    # body-flood from reaching the app at all.
    client_max_body_size 1m;

    # -----------------------------------------------------------------------
    # Admin console: a static SPA build, no upstream and no application server.
    # -----------------------------------------------------------------------
    #
    # `base: './'` in the Vite config means asset URLs are relative to the
    # document, which is what lets the bundle live under a path prefix at all.
    #
    # The `add_header` lines are repeated from the server block on purpose.
    # nginx does NOT merge `add_header` across levels: a location that declares
    # even one loses *every* header from its parent. Dropping them here would
    # silently remove HSTS and nosniff from the console - the one surface a
    # logged-in administrator uses.
    location /console/ {
        root /var/www;
        index index.html;
        # Client-side routing: an unknown path is a route, not a 404. The
        # console uses hash routing today, so this is belt-and-braces.
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # CSP for the admin SPA. The hash allows the tiny theme boot script in
        # index.html; React's runtime-injected style attributes are covered by
        # `style-src 'unsafe-inline'`. Everything else (scripts, connects,
        # forms, frames, objects) is same-origin only.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' 'sha256-2bnjc/tcynls/sV+aNN8+Q8COAjxCnExw1vvKvdghgo'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Hashed filenames never change contents; `index.html` always does. Split
    # so the immutable rule cannot accidentally cover the entry point. Same
    # `add_header` caveat as above.
    location /console/assets/ {
        root /var/www;
        # One header, not two: `expires 1y` and an `add_header Cache-Control`
        # would each emit their own `Cache-Control`, and a client sees the union
        # of them. Spelling the whole directive out once is the only way to be
        # sure what the browser actually received.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # `/console` without the trailing slash would otherwise reach the API and
    # 404 there, because `location /` is the API.
    location = /console {
        return 301 /console/;
    }

    # WebSocket. Matched by prefix length, so it wins over `location /`
    # regardless of order - but keeping it first is easier to read.
    location /ws/ {
        proxy_pass http://realtaxihk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live trip is a long conversation with long idle gaps. The default
        # 60 s read timeout would drop a driver who is simply not moving.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://realtaxihk_api;
        proxy_http_version 1.1;
        # `Connection ""` clears the header so the keepalive pool to the
        # upstream is actually reused; without it every request opens a new
        # connection to the app.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for APPENDS $remote_addr to whatever the
        # client sent, so the real peer is always the RIGHTMOST entry. The app
        # reads from the right for exactly this reason (SEC-07) - see
        # app/core/client_ip.py::client_ip. Do not switch this to
        # `$http_x_forwarded_for`, which would pass a client-forged value
        # through and make every IP rate limit bypassable.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
