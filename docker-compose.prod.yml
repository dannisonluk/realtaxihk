# Production overlay. It is an OVERLAY, not a standalone file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The reason is the same one that made `.dockerignore` necessary: the base file
# carries the security hardening (SEC-06 loopback binds, SEC-19's requirement
# that POSTGRES_PASSWORD be supplied, SEC-31's `--no-proxy-headers`), and a
# standalone prod file would be a second copy of all of it. The second copy is
# the one that gets missed when the next finding lands.
#
# What this file adds: the TLS terminator, its certificate renewal, the mount
# that publishes the admin console's static build at /console/, and the explicit
# sizing numbers that the base file deliberately leaves to defaults.
#
# Before the first `up`, certificates must already exist — nginx cannot start
# without them and will restart-loop. See deploy/README.md for the bootstrap.

services:
  api:
    environment:
      # SEC-07. nginx terminates TLS in front of the api and appends the real
      # peer to X-Forwarded-For, so there is exactly ONE trusted hop.
      #   0 -> every request looks like it came from nginx, collapsing every
      #        per-IP rate limit into a single shared bucket;
      #   2 -> with no second proxy in the chain, the app reads the entry the
      #        client supplied, so the limits are forgeable.
      # See app/core/client_ip.py::client_ip and deploy/README.md.
      TRUSTED_PROXY_COUNT: "1"

      # The base file defaults this to `["https://hkfastdc.com"]`, which is now
      # the decided hostname (see the nginx header comment) — so the default is
      # no longer a guess. The overlay still demands an explicit value, because
      # a wrong origin does not break anything loudly: the browser blocks the
      # request and the server log stays empty. A plausible-looking default is
      # exactly the kind of value that ships broken. `:?` makes an unset value a
      # hard error at `up`, next to the other credentials this file already
      # requires.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env — e.g. '["https://hkfastdc.com"]'}

      # ---- connection pool -------------------------------------------------
      # These three numbers are ONE decision, not three. What has to stay under
      # Postgres' `max_connections` is
      #
      #     (DB_POOL_SIZE + DB_MAX_OVERFLOW) x API_WORKERS  +  reserved
      #
      # because the pool is per PROCESS. With the base file's hard-coded
      # 10 + 20 and 4 workers that is 120 against a default limit of 100: a
      # failure that only appears under production concurrency, which is the
      # whole reason `docs/REALTIME_POSITION_COST.md` §3.5 calls it a
      # correctness problem rather than an optimisation.
      #
      #     (10 + 20) x 1  =  30   <=  100 - 20 reserved   OK
      #
      # They are written out here rather than left implicit so the arithmetic
      # is visible next to the worker count it depends on.
      # `tests/test_prod_compose_pool_arithmetic.py` fails if they stop
      # agreeing with `PG_MAX_CONNECTIONS` below.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      # Declared as well as interpolated: compose resolves `${VAR:-default}`
      # from the host environment and `.env`, NOT from this block, so the value
      # below and the one in `command:` are two independent lookups that happen
      # to agree. `tests/test_prod_compose_pool_arithmetic.py` fails if they
      # drift apart, because then the arithmetic would be guarding a worker
      # count the container never runs.
      API_WORKERS: "${API_WORKERS:-1}"
      # 100 is asyncpg's own default and is correct when the app talks to
      # Postgres directly. It is NOT correct behind PgBouncer in transaction
      # mode — see the PgBouncer section of `deploy/README.md`, which is where
      # the checkpoints live. (It deliberately points there and not at a
      # `deploy/pgbouncer/` path: that compose file is not written yet, and a
      # comment that names a file which does not exist sends the reader looking
      # for one that never did.)
      DB_STATEMENT_CACHE_SIZE: "100"

      # Passed through from the host environment so a real deploy cannot
      # accidentally ship the repo defaults. `:?` makes an unset value a hard
      # error rather than a silent fallback.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
      SENTRY_DSN: ${SENTRY_DSN:-}

    # `--workers` is deliberately 1 by default.
    #
    # Not because one worker is enough forever, but because raising it is not a
    # one-line change: `ConnectionRegistry` and the rate limiter both keep
    # in-process state, so N workers mean the WebSocket ceiling
    # (`WS_MAX_CONNECTIONS_TOTAL`) and the counters are enforced N times over —
    # a correctness regression that no error message announces. Going wider is
    # a deliberate step with three parts (re-do the pool arithmetic above, move
    # the registry to Redis, then raise API_WORKERS), documented in
    # deploy/README.md.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
                    --workers ${API_WORKERS:-1}"

  db:
    # Spelled out even though 100 is the image default. The pool arithmetic
    # above is only meaningful against a number that is written down somewhere
    # this repo controls; an inherited default can change under us.
    #
    # 30 of the 100 are the api's, leaving 70 for `alembic upgrade head`,
    # psql, the nightly `pg_dump`, and monitoring.
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}

  nginx:
    # nginx >= 1.25.1 is required by the `http2 on;` directive in
    # deploy/nginx/hkfastdc.conf. Pinned to a major.minor line rather than
    # `latest` so a deploy is reproducible; bump deliberately.
    image: nginx:1.27-alpine
    container_name: realtaxi-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/hkfastdc.conf:/etc/nginx/conf.d/hkfastdc.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - nginx-logs:/var/log/nginx
      # The admin console's static build, served at /console/.
      #
      # ONE mount is enough: `location /console/` and `location /console/assets/`
      # in hkfastdc.conf both use `root /var/www`, so they resolve to
      # /var/www/console/... and /var/www/console/assets/... respectively —
      # exactly the tree Vite writes (dist/index.html + dist/assets/*). The
      # `base: './'` in admin-web/web/vite.config.ts is what keeps the asset
      # URLs relative, which is what lets the bundle live under a path prefix
      # at all.
      #
      # `:ro` because nginx only reads. The source MUST be built before `up`:
      # a missing bind source is created as an empty root-owned directory, and
      # nginx then answers 404 on every console route — KYC review, dispute
      # adjudication, refunds, fleet settlement — with nothing in any log to
      # say why. Build it first; see deploy/README.md §"Console build".
      - ./admin-web/web/dist:/var/www/console:ro
    # Two things happen before nginx starts.
    #
    # `rm -f /etc/nginx/conf.d/default.conf` — the stock image ships a server
    # block that listens on :80 for `server_name localhost`. Left in place it
    # answers every request whose Host does not match ours, so a typo'd
    # hostname gets the nginx welcome page instead of a TLS error, which is a
    # confusing thing to debug at 3am.
    #
    # The reload loop — certbot renews into the SAME `letsencrypt` volume, but
    # nginx only reads the certificate at start or reload. The two are separate
    # containers with no signal channel between them, so the simplest correct
    # thing is to re-read periodically. Six hours bounds how long a renewed
    # certificate sits unused, against a 90-day lifetime.
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf &&
             (while :; do sleep 6h; nginx -s reload; done) &
             exec nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 1m
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v3.1.0
    container_name: realtaxi-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # `--webroot` rather than `--standalone`: nginx is already holding :80 by
    # the time renewals run, and the config reserves
    # `/.well-known/acme-challenge/` for exactly this. `$${!}` escapes the `$`
    # from compose's own interpolation so the shell sees `wait $!`.
    #
    # A renewal that fails does not exit the loop — `certbot renew` is a no-op
    # until 30 days before expiry, so a transient DNS or network problem
    # resolves itself on the next pass rather than taking the container down.
    entrypoint: >
      sh -c "trap 'exit 0' TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  # Shared between nginx (reader) and certbot (writer). Losing this volume
  # means re-issuing, and Let's Encrypt rate-limits issuance per domain per
  # week — so it is a named volume, not a bind mount that can be tidied away.
  letsencrypt:
  certbot-webroot:
  nginx-logs:
