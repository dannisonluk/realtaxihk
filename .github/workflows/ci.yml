name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: realtaxi
          POSTGRES_PASSWORD: realtaxi-ci
          POSTGRES_DB: realtaxihk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realtaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run full test suite
        env:
          APP_ENV: dev
          # The dev OTP (fixed 123456, echoed in the response) is behind an explicit
          # switch now — tests need it, production must never set it.
          ALLOW_DEV_OTP: "true"
          # 127.0.0.1 rather than localhost: localhost also resolves to ::1, and
          # the service containers are published on IPv4 only. On a Linux runner
          # the ::1 attempt is refused instantly, but pinning the family removes
          # the ambiguity (and matches the app's own default).
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: realtaxi
          POSTGRES_PASSWORD: realtaxi-ci
          POSTGRES_DB: realtaxihk
          REDIS_URL: redis://127.0.0.1:6379/0
          # Must satisfy the entropy check (>= 32 chars, >= 8 distinct characters).
          JWT_SECRET_KEY: ci-only-secret-not-for-prod-4f8a2c9e1b7d3065aa4e
        run: uv run pytest -q
