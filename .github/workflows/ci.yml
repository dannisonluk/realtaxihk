name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Backend. The job id stays `test` on purpose — renaming it would break any
  # branch-protection rule that names it as a required check.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: realtaxi
          POSTGRES_PASSWORD: realtaxi-ci
          POSTGRES_DB: realtaxihk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realtaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Job-level rather than step-level so the drill and the audit below inherit
    # them too. The drill scrubs every key it manages from the ambient
    # environment before each case (see MANAGED in
    # scripts/verify/prod_boot_drill.py), so an inherited value cannot make a
    # "refuse" case pass for the wrong reason.
    env:
      APP_ENV: dev
      # 127.0.0.1 rather than localhost: localhost also resolves to ::1, and
      # the service containers are published on IPv4 only. On a Linux runner
      # the ::1 attempt is refused instantly, but pinning the family removes
      # the ambiguity (and matches the app's own default).
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: realtaxi
      POSTGRES_PASSWORD: realtaxi-ci
      POSTGRES_DB: realtaxihk
      REDIS_URL: redis://127.0.0.1:6379/0
      # Must satisfy the entropy check (>= 32 chars, >= 8 distinct characters).
      JWT_SECRET_KEY: ci-only-secret-not-for-prod-4f8a2c9e1b7d3065aa4e
      # ALLOW_DEV_OTP is deliberately absent. It used to be set to "true" here,
      # with a comment claiming the tests needed it — but tests/conftest.py
      # assigns it unconditionally to "false" before any app module is
      # imported, so the value never took effect and the comment was wrong.

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run full test suite
        run: uv run pytest -q

      # Not covered by pytest. This is the only thing that boots the app under
      # APP_ENV=prod, and it had already rotted once from being absent here:
      # two required prod settings were added later and nothing failed, so it
      # sat at 6/7 without anyone seeing it.
      - name: Prod boot fail-fast drill
        run: uv run python scripts/verify/prod_boot_drill.py

      - name: Dependency audit (pip-audit)
        run: uvx pip-audit --path .venv --progress-spinner off -f json

      # Also not covered by pytest. It compares every captured response fixture
      # against the declared response_model — and `response_model=` is a filter,
      # not an annotation: FastAPI silently drops any key it does not declare.
      - name: Response-model contract audit
        run: uv run python scripts/verify/audit_response_models.py

  # Types. Neither ruff nor pytest can see this class of defect: ruff does not
  # infer types at all, so a wrong annotation is invisible to every other gate.
  # That is how a *correct* call — `money_str(settings.weekly_fee_hkd)`, where
  # the setting is an `int` — came to be flagged by editors while CI stayed
  # green for months.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `--all-extras` for mypy itself (a dev dependency); `--frozen` because
      # the lockfile is the authority — see the note on the floors in
      # pyproject.toml.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # Configuration lives in `[tool.mypy]`; the target list is `files = ["app"]`.
      # No service containers: this reads source, not a database.
      - name: Type check (mypy)
        run: uv run mypy

  mobile:
    runs-on: ubuntu-latest
    # 15 was enough for analyze + two Dart scripts. The APK build adds a cold
    # Gradle 9.1 download plus the Android SDK components AGP 9 needs, which is
    # minutes, not seconds.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Runs first so a stale asset fails in seconds rather than after the
      # Flutter SDK and the whole Gradle build have been set up.
      #
      # The brand assets are generated from the posters in `branding/source/` by
      # `tool/gen_branding_assets.py`, and the generated files are committed.
      # Nothing else would notice if the artwork were replaced and the icons
      # never regenerated: `flutter analyze` does not read `res/`, and the APK
      # build below happily ships whatever happens to be committed.
      #
      # Pillow is deliberately NOT a project dependency — this script runs by
      # hand when the artwork changes, not on every test run — so it is resolved
      # ephemerally. `--no-project` keeps it out of `uv.lock`.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Brand assets are current
        run: uv run --no-project --with pillow python tool/gen_branding_assets.py --check

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the lockfile was resolved against (pubspec.lock
          # declares dart >=3.12.0 / flutter >=3.44.0). Using `stable` instead
          # would let a Flutter release break this job with no code change.
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      # The mobile README states the standard as `dart format --line-length 100`,
      # and until now nothing enforced it. It had already drifted: the Dart 3.12
      # formatter joins lines the older one split, so eight files were
      # non-conforming while `flutter analyze` stayed green (it checks the code,
      # not its layout). `--set-exit-if-changed` is what makes this a gate rather
      # than a report.
      #
      # The `--line-length 100` flag is not optional: the tool defaults to 80,
      # and the repo is written at 100, so omitting it would flag every file.
      - name: Format check
        run: dart format --line-length 100 --output=none --set-exit-if-changed lib tool

      # The mobile README tells you to drive the analyzer through
      # tool/dart_check.py instead. That is a workaround for the Windows dev
      # sandbox, where the Dart VM cannot spawn pipe-using subprocesses
      # (ERROR_PIPE_BUSY 231) — it is the same engine and the same
      # analysis_options.yaml. On a Linux runner the standard analyzer works,
      # so use it.
      - name: Analyze
        run: flutter analyze

      # `dart <file>` goes through dartdev, which runs the native-assets build
      # hook and dies on the sandbox. Passing --packages explicitly runs the VM
      # straight on the script, which works on both platforms.
      - name: Assertions
        run: dart --packages=.dart_tool/package_config.json tool/run_tests.dart

      - name: Wire-contract fixtures
        run: dart --packages=.dart_tool/package_config.json tool/verify_contract.dart

      # Nothing here used to compile the Android build at all. `flutter analyze`
      # is a Dart check: it never reads `build.gradle.kts`, never resolves the
      # manifest placeholders and never registers the native plugins. So a build
      # script that had never once been compiled shipped, and it only surfaced
      # when someone ran the build by hand -- `app/build.gradle.kts` wrote
      # `java.util.Properties()`, which does not compile in a project script.
      #
      # This step is the gate for that class of defect: it runs Gradle for real.
      # Keep it --debug on purpose. A debug build needs no signing key, so the
      # gate stays green on a repo that has no credentials; a release build would
      # fail here until a keystore exists, which is not what this is checking.
      - name: Build debug APK
        run: flutter build apk --debug

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --no-file-parallelism --pool=forks mirrors the documented local command.
      # The flags exist for the dev sandbox's fs shim; they are harmless here,
      # and using the identical invocation keeps CI and local results
      # comparable.
      - name: Unit tests
        run: npx vitest run --no-file-parallelism --pool=forks

      - name: Build
        run: npm run build

      # Production dependencies only. The full `npm audit` currently reports
      # dev-only findings in the Vite toolchain (vite / vitest / source-map-js);
      # those are tracked in docs/TECHNICAL_OPTIMIZATION_BACKLOG.md until the
      # major-bump upgrade lands.
      - name: Dependency audit (npm, production only)
        run: npm audit --omit=dev --audit-level=high --json
