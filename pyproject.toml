[project]
name = "realtaxihk-backend"
version = "0.1.0"
description = "realtaxihk.com - HK taxi matching platform backend (FastAPI + PostGIS + Redis)"
requires-python = ">=3.11"
# The `>=` floors below are for readability and for `uv lock` to have something
# to solve. They are NOT the deployed versions: `uv.lock` is the authority, and
# every install path (Dockerfile, CI, README) must pass `--frozen` so all three
# resolve identically. A floor bump without a re-lock changes nothing anywhere
# until the next `uv sync --frozen` fails or silently re-locks.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-client>=0.20",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    # The IANA timezone database, for `zoneinfo` on platforms that do not ship
    # one. Linux has it in the OS, so the production image needs nothing extra —
    # but Windows has none, and `ZoneInfo("Asia/Hong_Kong")` raises
    # `ZoneInfoNotFoundError` there, which would break the analytics date range
    # for every developer and for the test suite. It is a small pure-data wheel,
    # and depending on it unconditionally is cheaper than a platform branch.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions: autogenerated migrations — not style-gated.
# docs: ruff also formats fenced python blocks inside Markdown. The audit and
# readiness reports quote deliberately illustrative snippets (one-line
# `if x: raise`, collapsed error paths) that must read as written.
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — unused imports/vars
    "I",        # import sorting
    "UP",       # pyupgrade (py311)
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "S",        # bandit — security
    "PLW",      # pylint warnings
    "TRY",      # exception hygiene
    "RUF",      # ruff-specific
]
ignore = [
    "B008",                          # FastAPI Depends()/Query() in defaults IS the framework idiom
    "RUF001", "RUF002", "RUF003",    # ambiguous unicode — docstrings/comments are bilingual (CJK punct)
    "PLW0603",                       # lazy module singletons in app/core/db.py use `global` by design
    "TRY003",                        # raise HTTPException(detail=...) long messages are the API style
    "UP042",                         # keep (str, Enum): StrEnum changes str() semantics used in responses
    "FURB157",                       # money code keeps string Decimal() constructors for precision consistency
]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S104", "S105"]   # container 0.0.0.0 default + documented dev-only secrets
"tests/*" = ["S101", "S105", "S106", "S107"]   # pytest asserts + literal test secrets are intentional
"scripts/**" = ["S310", "S603", "S607"]    # localhost dev tooling: urlopen/subprocess vs own server
"scripts/verify/live_smoke.py" = ["S101"]        # asserts are the smoke checks themselves
# Same rationale: this harness's `assert`s ARE the fixture contract checks — each
# one pins a response shape the mobile client decodes.
"scripts/dev/gen_mobile_fixtures.py" = ["S101"]
# The adversarial probes (docs/SECURITY_AUDIT.md). `assert` IS the check here;
# the hardcoded "secrets" are the known-bad values the probe must prove are
# rejected, so they have to be literals; and unpacking a whole response only to
# assert on one field is noise, not a defect.
"scripts/verify/security_probe.py" = ["S101", "S105", "SIM115", "RUF059"]
"scripts/verify/security_verify.py" = ["S101", "S105", "RUF059"]
# Same class as scripts/: local dev tooling that drives its own server over a
# pipe. The `assert`s are the harness's own invariants (the stream handles it
# just opened), and `subprocess.Popen` runs an argument list it built itself.
"mobile/tool/*" = ["S101", "S603", "S110"]
"alembic/env.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
# SQLAlchemy 2.0 and FastAPI ship their own typing, so no plugin is needed:
# `Mapped[...]`, `Depends()` and the Pydantic models all resolve as written.
# That is worth stating because the opposite is the usual assumption, and it is
# the reason this gate could be turned on for the whole of `app/` at once
# instead of being staged module by module.
show_error_codes = true
# `warn_unused_ignores` also makes a stale `# type: ignore` fail the gate, so an
# annotation cannot be silenced and then quietly become unnecessary. There are
# no `# type: ignore` comments under `app/` today; the two deliberate escapes
# are `cast(...)` calls that carry a comment explaining why.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# boto3 ships neither a `py.typed` marker nor stubs. `storage_service` is the
# only consumer and it is a thin wrapper over `put_object` /
# `generate_presigned_url`, whose shapes the API tests pin rather than the types.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
